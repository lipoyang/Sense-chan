<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>センスチャンのデモ</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #c5cae9; /* 背景色 (画像に合わせる) */
    overflow: hidden; /* スクロールバー非表示 */
  }
  /* 中央に配置 */
  #canvasWrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  /* canvasをブロック要素に */
  canvas {
    display: block;
  }
  @font-face {
    font-family: "GenEiMGothic2";
    src: url("GenEiMGothic2-Black.ttf") format("truetype");
  }
</style>
</head>

<body>
<div id="canvasWrapper">
  <canvas id="myCanvas"></canvas>
</div>
<script src="gamepad.js"></script>
<script src="main.js"></script>
</body>
